events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Production optimizations for handling incoming client logs
    sendfile        on;
    keepalive_timeout  65;

    # Secure Header Configurations
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Main Upstream Cluster Mappings
    upstream web_frontend {
        server web:3000;
    }

    upstream backend_api {
        server api_gateway:8000;
    }

    server {
        listen 80;
        server_name localhost; # Replace with your actual domain (e.g., app.yourcompany.in)

        # Redirect all unencrypted HTTP traffic to HTTPS in real production environments
        
        # 1. Route React Web Frontend Assets
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route FastAPI Ingestion Traffic
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable body size constraints for high-throughput receipt processing scans
            client_max_body_size 10M;
        }
    }
}
